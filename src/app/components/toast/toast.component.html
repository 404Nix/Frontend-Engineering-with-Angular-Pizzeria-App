<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 999;">
  <div
    *ngFor="let toast of toastService.toasts"
    class="toast show align-items-center border-0"
    [ngClass]="{
      'text-bg-success': toast.type === 'success',
      'text-bg-danger': toast.type === 'danger',
      'text-bg-warning': toast.type === 'warning',
      'text-bg-info': toast.type === 'info'
    }"
    role="alert"
  >
    <div class="d-flex">
      <div class="toast-body">{{ toast.message }}</div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        aria-label="Close"
        (click)="toastService.remove(toast)"
      ></button>
    </div>
  </div>
</div>
